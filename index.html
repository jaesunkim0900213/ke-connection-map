<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일본 6수송 연결도 — KE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif;font-size:14px;background:#f4f6f8;color:#2c3e50}

/* ── NAV ── */
.nav{background:#1a3a5c;display:flex;align-items:stretch;position:sticky;top:0;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.nav-brand{color:#fff;font-size:16px;font-weight:700;padding:0 20px;display:flex;align-items:center;border-right:1px solid rgba(255,255,255,.15);white-space:nowrap}
.nav-brand small{font-size:11px;font-weight:400;opacity:.6;margin-left:6px}
.nav-tab{color:rgba(255,255,255,.6);padding:14px 16px;cursor:pointer;font-size:13px;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-tab.active{color:#fff;border-bottom-color:#5b9bd5;font-weight:600}
.badge{background:#5b9bd5;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;margin-left:5px}

/* ── SEASON BAR ── */
.season-bar{background:#0f2744;padding:0 24px;display:flex;align-items:center;gap:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.season-label{color:rgba(255,255,255,.5);font-size:11px;font-weight:600;margin-right:8px;white-space:nowrap}
.s-btn{color:rgba(255,255,255,.55);padding:8px 16px;cursor:pointer;font-size:12px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;border-radius:0}
.s-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.s-btn.active{color:#fff;border-bottom-color:#f0a500;font-weight:700}
.s-btn.disabled{color:rgba(255,255,255,.25);cursor:default;pointer-events:none}
.s-btn.disabled span{font-size:10px;opacity:.7;margin-left:4px}
.season-diff{margin-left:auto;font-size:11px;color:rgba(255,255,255,.45);padding:8px 0}

/* ── FILTER BAR ── */
.fbar{background:#fff;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #dde3ea}
.fl{font-size:12px;color:#555;font-weight:600;white-space:nowrap}
select,input[type=text]{border:1px solid #d0d7df;border-radius:6px;padding:5px 10px;font-size:13px;background:#fff;cursor:pointer}
select:focus,input:focus{outline:none;border-color:#5b9bd5}
.btn{background:#f4f6f8;border:1px solid #d0d7df;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;color:#444}
.btn:hover{background:#e8edf2}
.sep{width:1px;height:22px;background:#dde3ea;margin:0 2px}
.mct-sel{border:1.5px solid #5b9bd5!important;background:#f0f6ff!important;font-weight:600;color:#1a3a5c!important}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;margin-left:auto}
.leg span{display:flex;align-items:center;gap:4px;margin-left:10px}

/* ── PANES ── */
.pane{display:none;padding:20px 24px}
.pane.active{display:block}
#pane-map{padding:0;position:relative}
#mapbox{height:calc(100vh - 118px);min-height:480px;width:100%}

/* ── STATS ── */
.stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:12px 18px;min-width:110px}
.stat-n{font-size:24px;font-weight:700;line-height:1;color:#1a3a5c}
.stat-l{font-size:12px;color:#888;margin-top:4px}
.stat-note{font-size:11px;color:#5b9bd5;margin-top:2px}
.stat-diff{font-size:11px;margin-top:2px}

/* ── TABLE ── */
.wrap{overflow-x:auto;border-radius:8px;border:1px solid #dde3ea;background:#fff}
table{border-collapse:collapse;font-size:13px;width:100%}
thead th{background:#1a3a5c;color:#fff;padding:9px 10px;text-align:center;font-size:12px;font-weight:600;white-space:nowrap;position:sticky;top:0}
th.l,td.l{text-align:left;padding-left:14px}
td{padding:7px 10px;border-bottom:1px solid #f0f2f4;text-align:center;font-size:13px;vertical-align:middle}
td.dest{font-weight:700;font-size:14px}
td.time{font-variant-numeric:tabular-nums;color:#444}
tr:hover td{background:#f7f9fc!important}
.rgrow td{font-weight:600;font-size:12px;color:#fff;padding:4px 14px}
.c-IB{background:#d4edda;color:#1a5c2a;border-radius:4px;font-weight:700;font-size:11px;padding:2px 3px;display:inline-block;width:100%;text-align:center;line-height:1.4}
.c-BI{background:#d0e4f7;color:#0d3d6e;border-radius:4px;font-weight:700;font-size:11px;padding:2px 3px;display:inline-block;width:100%;text-align:center;line-height:1.4}
.c-OB{background:#fef3cd;color:#7a5500;border-radius:4px;font-weight:700;font-size:11px;padding:2px 3px;display:inline-block;width:100%;text-align:center;line-height:1.4}
.c-time{font-size:9px;opacity:.85;display:block}
/* 시즌 diff 하이라이트 */
.new-route td{background:#f0fdf4!important}
.new-route td:first-child::before{content:"▲NEW ";font-size:9px;color:#22c55e;font-weight:700}
.del-route td{background:#fff5f5!important;opacity:.7}

/* ── AIRPORT CARDS ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;overflow:hidden}
.chdr{background:#1a3a5c;color:#fff;padding:10px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.chdr small{font-size:12px;font-weight:400;opacity:.75}
.crow{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #f0f2f4;gap:8px}
.crow:last-child{border-bottom:none}
.rtag{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.cdest{font-weight:700;font-size:14px;min-width:36px}
.cflt{font-size:11px;color:#888;flex:1}
.ctm{font-size:12px;color:#555;text-align:right;white-space:nowrap}
.cbadge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.cmin{font-size:10px;opacity:.8;margin-left:2px}

/* ── TIMELINE ── */
.tl{display:flex;flex-direction:column;gap:6px}
.tli{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.tli:hover{border-color:#5b9bd5}
.tlt{font-size:20px;font-weight:800;color:#1a3a5c;min-width:60px;font-variant-numeric:tabular-nums}
.tlb{flex:1}
.tlr{font-size:14px;font-weight:700}
.tlf{font-size:12px;color:#888;margin-top:2px}
.tlaps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tlap{font-size:12px;padding:2px 8px;border-radius:4px;font-weight:600}
.tlap.IB{background:#d4edda;color:#1a5c2a}
.tlap.BI{background:#d0e4f7;color:#0d3d6e}
.tlap.OB{background:#fef3cd;color:#7a5500}
.tlcnt{background:#eef2f7;color:#1a3a5c;border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px;text-align:center;min-width:52px}

/* ── MAP ── */
.mleg{position:absolute;bottom:28px;left:12px;z-index:900;background:rgba(255,255,255,.95);border:1px solid #dde3ea;border-radius:8px;padding:12px 16px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mleg strong{display:block;margin-bottom:8px;color:#1a3a5c;font-size:13px;font-weight:700}
.ml{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.mct-badge{position:absolute;top:12px;right:12px;z-index:900;background:#1a3a5c;color:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nodata{text-align:center;color:#bbb;padding:50px;font-size:14px}
.mno{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;background:rgba(255,255,255,.97);border:1px solid #dde3ea;border-radius:10px;padding:24px 32px;text-align:center;font-size:14px;color:#555;box-shadow:0 4px 16px rgba(0,0,0,.1);pointer-events:none;display:none}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <div class="nav-brand">일본 6수송 연결도<small>Korean Air</small></div>
  <div class="nav-tab active" onclick="showTab(this,'matrix')">매트릭스<span class="badge" id="bm">0</span></div>
  <div class="nav-tab" onclick="showTab(this,'airport')">공항별<span class="badge" id="ba">-</span></div>
  <div class="nav-tab" onclick="showTab(this,'timeline')">타임라인</div>
  <div class="nav-tab" onclick="showTab(this,'map')">노선도</div>
</div>

<!-- SEASON BAR -->
<div class="season-bar">
  <span class="season-label">시즌</span>
  <div class="s-btn active" onclick="setSeason('W25',this)">W25<br><small style="font-size:10px;opacity:.7">2024/25 동계</small></div>
  <div class="s-btn" onclick="setSeason('S26',this)">S26<br><small style="font-size:10px;opacity:.7">2026 하계</small></div>
  <div class="s-btn disabled">W26<br><span>준비중</span></div>
  <div class="season-diff" id="season-diff"></div>
</div>

<!-- FILTER BAR -->
<div class="fbar">
  <span class="fl">⏱ MAX 연결</span>
  <select id="fmct" onchange="render()" class="mct-sel">
    <option value="60">1시간</option>
    <option value="120">2시간</option>
    <option value="180">3시간</option>
    <option value="241" selected>4시간 ★기본</option>
    <option value="300">5시간</option>
    <option value="360">6시간</option>
  </select>
  <div class="sep"></div>
  <span class="fl">일본 공항</span>
  <select id="fap" onchange="render()">
    <option value="">전체</option>
    <option value="NRT">NRT 도쿄 나리타</option>
    <option value="HND">HND 도쿄 하네다</option>
    <option value="KIX">KIX 오사카</option>
    <option value="NGO">NGO 나고야</option>
    <option value="FUK">FUK 후쿠오카</option>
    <option value="CTS">CTS 삿포로</option>
    <option value="OKA">OKA 오키나와</option>
    <option value="AOJ">AOJ 아오모리</option>
    <option value="KIJ">KIJ 니가타</option>
    <option value="KOJ">KOJ 가고시마</option>
    <option value="KMQ">KMQ 고마쓰</option>
    <option value="OKJ">OKJ 오카야마</option>
    <option value="KMJ">KMJ 구마모토</option>
    <option value="NGS">NGS 나가사키</option>
    <option value="UKB">UKB 고베</option>
  </select>
  <div class="sep"></div>
  <span class="fl">지역</span>
  <select id="frg" onchange="render()">
    <option value="">전체</option>
    <option value="AME">미주</option>
    <option value="EUR">구주(유럽)</option>
    <option value="OCE">대양주</option>
    <option value="SEA">동남아</option>
    <option value="CHN">중국</option>
  </select>
  <div class="sep"></div>
  <span class="fl">목적지</span>
  <input type="text" id="fds" placeholder="LAX, BKK..." oninput="render()" style="width:90px">
  <div class="sep"></div>
  <span class="fl">방향</span>
  <select id="fdr" onchange="render()">
    <option value="">전체</option>
    <option value="IB">◀ 일본발</option>
    <option value="BI">▶◀ 양방향</option>
    <option value="OB">▶ 해외발</option>
  </select>
  <button class="btn" onclick="resetF()">초기화</button>
  <div class="leg">
    <span><svg width="20" height="4"><line x1="0" y1="2" x2="20" y2="2" stroke="#3a7d44" stroke-width="3"/></svg>◀ 일본발</span>
    <span><svg width="20" height="4"><line x1="0" y1="2" x2="20" y2="2" stroke="#1a5c9e" stroke-width="3"/></svg>▶◀ 양방향</span>
    <span><svg width="20" height="4"><line x1="0" y1="2" x2="20" y2="2" stroke="#b8860b" stroke-width="3" stroke-dasharray="4,2"/></svg>▶ 해외발</span>
  </div>
</div>

<!-- PANES -->
<div id="pane-matrix" class="pane active">
  <div class="stats" id="stats"></div>
  <div class="wrap"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<div id="pane-airport" class="pane"><div class="grid" id="agrid"></div></div>
<div id="pane-timeline" class="pane"><div class="tl" id="tlbox"></div></div>
<div id="pane-map" class="pane">
  <div id="mapbox"></div>
  <div class="mct-badge" id="mct-badge">⏱ MAX 4h</div>
  <div class="mleg">
    <strong>연결 방향</strong>
    <div class="ml"><svg width="28" height="4"><line x1="0" y1="2" x2="28" y2="2" stroke="#3a7d44" stroke-width="3"/></svg>◀ 일본발</div>
    <div class="ml"><svg width="28" height="4"><line x1="0" y1="2" x2="28" y2="2" stroke="#1a5c9e" stroke-width="3"/></svg>▶◀ 양방향</div>
    <div class="ml"><svg width="28" height="4"><line x1="0" y1="2" x2="28" y2="2" stroke="#b8860b" stroke-width="3" stroke-dasharray="5,3"/></svg>▶ 해외발만</div>
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-size:11px;color:#777;line-height:1.8">🔵 일본공항 (연결 있음)<br>⬜ 일본공항 (연결 없음)<br>공항 클릭 → 상세 팝업</div>
  </div>
  <div class="mno" id="mno">선택 조건에 연결 가능한 스케줄이 없습니다</div>
</div>

function fmtMin(m){if(!m)return"-";const h=Math.floor(m/60),n=m%60;return h>0?(n>0?`${h}h${n}m`:`${h}h`):`${n}m`;}

// 시즌 전환
function setSeason(s, el){
  if(SEASONS[s].length===0)return;
  curSeason=s;
  document.querySelectorAll(".s-btn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
  updateSeasonDiff();
  render();
}

function updateSeasonDiff(){
  const prev={"W25":null,"S26":"W25","W26":"S26"}[curSeason];
  const el=document.getElementById("season-diff");
  if(!prev||!SEASONS[prev]||!SEASONS[curSeason]){el.textContent="";return;}
  const cur=new Set(SEASONS[curSeason].map(f=>f.route+"_"+f.flt));
  const pre=new Set(SEASONS[prev].map(f=>f.route+"_"+f.flt));
  const added=[...cur].filter(x=>!pre.has(x)).length;
  const removed=[...pre].filter(x=>!cur.has(x)).length;
  const prevLbl={"W25":"W25","S26":"S26"}[prev];
  el.textContent=`vs ${prevLbl} → 신규 +${added}편 / 삭제 -${removed}편`;
}

function getFilteredConns(fl, maxMin){
  const cm=fl.conn_mins||{};
  const res={};
  for(const ap of APLIST){
    const m=cm[ap];
    if(m!=null&&m>=MCT&&m<=maxMin){res[ap]=fl.conns[ap]||"IB";}
  }
  return res;
}

function filterFlights(f){
  const FL=SEASONS[curSeason]||[];
  return FL.filter(fl=>{
    if(f.rg&&fl.region!==f.rg)return false;
    if(f.ds&&!fl.route.includes(f.ds))return false;
    const conns=getFilteredConns(fl,f.mct);
    if(f.ap){if(!conns[f.ap])return false;if(f.dr&&conns[f.ap]!==f.dr)return false;}
    else if(f.dr){if(!Object.values(conns).includes(f.dr))return false;}
    if(Object.keys(conns).length===0)return false;
    return true;
  }).map(fl=>{
    const _conns=getFilteredConns(fl,f.mct);
    // 이전 시즌 대비 신규/변경 체크
    const prev={"W25":null,"S26":"W25","W26":"S26"}[curSeason];
    let isNew=false;
    if(prev&&SEASONS[prev]){
      isNew=!SEASONS[prev].some(p=>p.route===fl.route&&p.flt===fl.flt);
    }
    return{...fl,_conns,_isNew:isNew};
  });
}

function aaps(fls,apF){return apF?APLIST.filter(a=>a===apF):APLIST.filter(a=>fls.some(fl=>fl._conns[a]));}
function sym(ct){return ct==="BI"?"▶◀":ct==="IB"?"◀":"▶";}

function showTab(el,t){
  curTab=t;
  document.querySelectorAll(".nav-tab").forEach(e=>e.classList.remove("active"));
  el.classList.add("active");
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("active"));
  document.getElementById("pane-"+t).classList.add("active");
  if(t==="map"){setTimeout(()=>{if(!map)initMap();else map.invalidateSize(true);render();},120);}
  else render();
}

function renderMatrix(fls,f){
  const aps=aaps(fls,f.ap);
  document.getElementById("th").innerHTML=
    "<th class='l' style='min-width:58px'>지역</th><th class='l' style='min-width:50px'>목적지</th><th class='l' style='min-width:120px'>왕복편</th><th style='min-width:62px'>ICN착</th><th style='min-width:62px'>ICN발</th>"+
    aps.map(a=>`<th title="${APMETA[a].n}" style="min-width:52px">${a}<br><span style="font-size:9px;font-weight:400;opacity:.8">${APMETA[a].n}</span></th>`).join("");
  let h="",last="";
  fls.forEach(fl=>{
    if(fl.region!==last){
      h+=`<tr class="rgrow"><td colspan="${5+aps.length}" style="background:${RC[fl.region]||"#444"}">${fl.regionKo} · ${fl.region}</td></tr>`;
      last=fl.region;
    }
    const newCls=fl._isNew?" new-route":"";
    h+=`<tr class="${newCls}"><td class="l"><span class="rtag" style="background:${RC[fl.region]||"#888"}">${fl.regionKo}</span></td><td class="l dest">${fl.route}</td><td class="l" style="font-size:12px;color:#666">${fl.obFlt}/${fl.ibFlt}</td><td class="time">${fl.ibTime}</td><td class="time">${fl.obTime}</td>`;
    aps.forEach(a=>{
      const ct=fl._conns[a];
      const mins=(fl.conn_mins||{})[a];
      h+=ct?`<td><span class="c-${ct}">${sym(ct)}<span class="c-time">${fmtMin(mins)}</span></span></td>`:"<td style='color:#d5dbe2'>—</td>";
    });
    h+="</tr>";
  });
  document.getElementById("tb").innerHTML=h||`<tr><td colspan="${5+aps.length}" class="nodata">조건에 맞는 노선 없음</td></tr>`;
  document.getElementById("bm").textContent=fls.length;
  const ibC=fls.filter(fl=>Object.values(fl._conns).some(c=>c==="IB"||c==="BI")).length;
  const biC=fls.filter(fl=>Object.values(fl._conns).some(c=>c==="BI")).length;
  const newC=fls.filter(fl=>fl._isNew).length;
  const prev={"W25":null,"S26":"W25","W26":"S26"}[curSeason];
  const diffHtml=newC>0?`<div class="stat-diff" style="color:#22c55e">▲ 신규 ${newC}편</div>`:"";
  document.getElementById("stats").innerHTML=
    `<div class="stat"><div class="stat-n">${fls.length}</div><div class="stat-l">전체 노선</div><div class="stat-note">MAX ${fmtMin(f.mct)}</div>${diffHtml}</div>`+
    `<div class="stat"><div class="stat-n" style="color:#3a7d44">${ibC}</div><div class="stat-l">◀ 일본발 연결</div></div>`+
    `<div class="stat"><div class="stat-n" style="color:#1a5c9e">${biC}</div><div class="stat-l">▶◀ 양방향</div></div>`+
    `<div class="stat"><div class="stat-n">${aps.length}</div><div class="stat-l">활성 공항</div></div>`;
}

// ── AIRPORT ──
function renderAirport(fls,f){
  const aps=aaps(fls,f.ap);
  document.getElementById("ba").textContent=aps.length;
  document.getElementById("agrid").innerHTML=aps.map(ap=>{
    const rows=fls.filter(fl=>fl._conns[ap]);if(!rows.length)return"";
    const ibC=rows.filter(fl=>fl._conns[ap]==="IB"||fl._conns[ap]==="BI").length;
    return`<div class="card"><div class="chdr"><span>${ap} <small>${APMETA[ap].n}</small></span><span style="font-size:12px;opacity:.8">${rows.length}편 · ◀${ibC}</span></div>`+
    rows.map(fl=>{
      const ct=fl._conns[ap],mins=(fl.conn_mins||{})[ap];
      const bg={IB:"#d4edda",BI:"#d0e4f7",OB:"#fef3cd"}[ct];
      const fg={IB:"#1a5c2a",BI:"#0d3d6e",OB:"#7a5500"}[ct];
      return`<div class="crow">${fl._isNew?'<span style="font-size:9px;background:#22c55e;color:#fff;border-radius:3px;padding:1px 4px;font-weight:700">NEW</span>':""}
        <span class="rtag" style="background:${RC[fl.region]||"#888"}">${fl.region}</span>
        <span class="cdest">${fl.route}</span><span class="cflt">${fl.obFlt}/${fl.ibFlt}</span>

        <span class="cbadge" style="background:${bg};color:${fg}">${sym(ct)}<span class="cmin">${fmtMin(mins)}</span></span></div>`;
    }).join("")+"</div>";
  }).join("")||"<div class='nodata'>조건에 맞는 공항 없음</div>";
}

// ── TIMELINE ──
function renderTimeline(fls,f){
  const ap=f.ap;
  const items=fls.filter(fl=>{
    const ok=ap?(fl._conns[ap]==="IB"||fl._conns[ap]==="BI"):Object.values(fl._conns).some(c=>c==="IB"||c==="BI");
    return ok&&fl.obTime!=="-";
  }).sort((a,b)=>a.obTime.localeCompare(b.obTime));
  document.getElementById("tlbox").innerHTML=items.map(fl=>{
    const ibA=APLIST.filter(a=>ap?(a===ap&&(fl._conns[a]==="IB"||fl._conns[a]==="BI")):(fl._conns[a]==="IB"||fl._conns[a]==="BI"));
    return`<div class="tli"><div class="tlt">${fl.obTime}</div><div class="tlb">
      <div class="tlr">${fl._isNew?'<span style="font-size:9px;background:#22c55e;color:#fff;border-radius:3px;padding:1px 4px;font-weight:700;margin-right:6px">NEW</span>':""}
        <span class="rtag" style="background:${RC[fl.region]||"#888"};margin-right:8px">${fl.regionKo}</span>${fl.route}
        <span style="font-size:12px;color:#888;margin-left:8px;font-weight:400">${fl.obFlt}/${fl.ibFlt}</span></div>
      <div class="tlf">ICN 귀착 ${fl.ibTime}</div>
      <div class="tlaps">${ibA.map(a=>`<span class="tlap ${fl._conns[a]}">${a} ${sym(fl._conns[a])} <span style="font-size:10px;opacity:.8">${fmtMin((fl.conn_mins||{})[a])}</span></span>`).join("")}</div>
    </div><div class="tlcnt">${ibA.length}개<br>공항</div></div>`;
  }).join("")||"<div class='nodata'>일본발 연결편 없음</div>";
}

function initMap(){
  if(map)return;
  map=L.map("mapbox",{center:[36,134],zoom:5});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
    attribution:"\u00a9 OpenStreetMap \u00a9 CARTO",subdomains:"abcd",maxZoom:12
  }).addTo(map);
}
function clrMap(){mlayers.forEach(l=>{try{map.removeLayer(l);}catch(e){}});mlayers=[];}
function mkBox(lbl,bg,sz,op){return L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div style="background:${bg};color:#fff;border:2px solid rgba(255,255,255,.85);border-radius:5px;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-size:${sz>24?10:8}px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:${op||1};text-align:center;line-height:1.1">${lbl}</div>`});}
function mkCircle(lbl,bg,sz){return L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div style="background:${bg};color:#fff;border:2.5px solid rgba(255,255,255,.9);border-radius:50%;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3);text-align:center;line-height:1.1">${lbl}</div>`});}

function renderMap(fls,f){
  if(!map)return;clrMap();
  document.getElementById("mno").style.display=fls.length?"none":"block";
  if(!fls.length)return;
  document.getElementById("mct-badge").textContent="\u23f1 "+curSeason+" MAX "+fmtMin(f.mct);
  const apF=f.ap;
  const icnM=L.marker([ICN.lat,ICN.lng],{icon:mkCircle("인천<br>ICN","#1a3a5c",42),zIndexOffset:2000}).addTo(map);
  icnM.bindTooltip("<b>인천국제공항 (ICN)</b>",{direction:"right"});
  mlayers.push(icnM);
  const acmap={};
  APLIST.forEach(ap=>{
    const rel=fls.filter(fl=>fl._conns[ap]);
    if(!rel.length){acmap[ap]=null;return;}
    const t=rel.map(fl=>fl._conns[ap]);
    acmap[ap]=t.includes("BI")?"BI":t.includes("IB")?"IB":"OB";
  });
  APLIST.forEach(ap=>{
    const ct=acmap[ap],meta=APMETA[ap];
    const active=!!ct,hl=!apF||apF===ap;
    const color=active?LC[ct]:"#9ca3af";
    const sz=active?28:20,op=hl&&active?1:active?0.4:0.22;
    const m=L.marker([meta.lat,meta.lng],{icon:mkBox(ap,color,sz,op),zIndexOffset:active?500:50}).addTo(map);
    mlayers.push(m);
    if(active&&hl){
      const lo={color:LC[ct],weight:ct==="BI"?3.5:2.5,opacity:0.85,smoothFactor:1};
      if(ct==="OB")lo.dashArray="8,5";
      mlayers.push(L.polyline([[ICN.lat,ICN.lng],[meta.lat,meta.lng]],lo).addTo(map));
    }
    if(active){
      const rows=fls.filter(fl=>fl._conns[ap]);
      const lbl={IB:"◀ 일본발",BI:"▶◀ 양방향",OB:"▶ 해외발만"}[ct];
      let pop=`<div style="font-family:sans-serif;min-width:230px"><div style="font-weight:700;font-size:14px;margin-bottom:4px">${ap} ${meta.n}</div><div style="font-size:12px;color:#555;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eee">${lbl} · ${rows.length}편 (${curSeason})</div><table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#f4f6f8;font-weight:600"><td style="padding:3px 6px">목적지</td><td style="text-align:center">방향</td><td style="text-align:center">연결시간</td><td style="text-align:center">ICN발</td></tr>`;
      rows.slice(0,10).forEach(fl=>{
        const mins=(fl.conn_mins||{})[ap];
        pop+=`<tr style="border-top:1px solid #f0f2f4${fl._isNew?";background:#f0fdf4":""}"><td style="padding:3px 6px;font-weight:600">${fl._isNew?"▲ ":""}${fl.route}</td><td style="text-align:center">${sym(fl._conns[ap])}</td><td style="text-align:center;font-weight:600">${fmtMin(mins)}</td><td style="text-align:center">${fl.obTime}</td></tr>`;
      });
      if(rows.length>10)pop+=`<tr><td colspan="4" style="padding:3px 6px;color:#999;font-size:11px">외 ${rows.length-10}편...</td></tr>`;
      pop+="</table></div>";
      m.bindPopup(pop,{maxWidth:290});
      m.on("click",()=>{const s=document.getElementById("fap");s.value=(s.value===ap)?"":ap;render();});
    }else{
      m.bindTooltip(`${ap} ${meta.n}<br><small style="color:#c00">현재 조건 연결 없음</small>`,{direction:"top"});
    }
  });
  const destmap={};
  fls.forEach(fl=>{
    if(!destmap[fl.route])destmap[fl.route]={fls:[],types:new Set()};
    destmap[fl.route].fls.push(fl);
    const ct=apF?fl._conns[apF]:null;
    if(ct)destmap[fl.route].types.add(ct);
    else Object.values(fl._conns).forEach(c=>destmap[fl.route].types.add(c));
  });
  Object.entries(destmap).forEach(([route,info])=>{
    const coord=DC[route];if(!coord)return;
    const ts=[...info.types];
    const ct=ts.includes("BI")?"BI":ts.includes("IB")?"IB":ts.includes("OB")?"OB":null;if(!ct)return;
    const lo={color:LC[ct],weight:2,opacity:0.5,smoothFactor:1};if(ct==="OB")lo.dashArray="7,5";
    mlayers.push(L.polyline([[ICN.lat,ICN.lng],coord],lo).addTo(map));
    const di=L.divIcon({className:"",iconSize:null,iconAnchor:[0,8],html:`<div style="background:${RC[info.fls[0].region]||"#555"};color:#fff;border:1.5px solid rgba(255,255,255,.7);border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)">${route}</div>`});
    const dm=L.marker(coord,{icon:di,zIndexOffset:100}).addTo(map);
    let dpop=`<div style="font-family:sans-serif;min-width:200px"><div style="font-weight:700;font-size:14px;margin-bottom:6px">${route} (${info.fls[0].regionKo})</div><table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#f4f6f8;font-weight:600"><td style="padding:3px 6px">편명</td><td>방향</td><td>연결시간</td></tr>`;
    info.fls.forEach(fl=>{const ct2=apF?fl._conns[apF]:Object.values(fl._conns)[0];const mins=apF?(fl.conn_mins||{})[apF]:null;dpop+=`<tr style="border-top:1px solid #f0f2f4"><td style="padding:3px 6px">${fl.obFlt}</td><td style="text-align:center">${ct2?sym(ct2):"-"}</td><td style="text-align:center;font-weight:600">${fmtMin(mins)}</td></tr>`;});
    dpop+="</table></div>";dm.bindPopup(dpop,{maxWidth:260});mlayers.push(dm);
  });
  const coords=[[ICN.lat,ICN.lng]];
  if(apF&&APMETA[apF])coords.push([APMETA[apF].lat,APMETA[apF].lng]);
  Object.keys(destmap).forEach(r=>{if(DC[r])coords.push(DC[r]);});
  if(!apF)APLIST.filter(a=>acmap[a]).forEach(a=>coords.push([APMETA[a].lat,APMETA[a].lng]));
  try{map.fitBounds(coords,{padding:[50,50],maxZoom:6});}catch(e){}
}

function render(){
  const f=getF(),fls=filterFlights(f);
  if(curTab==="matrix")        renderMatrix(fls,f);
  else if(curTab==="airport")  renderAirport(fls,f);
  else if(curTab==="timeline") renderTimeline(fls,f);
  else if(curTab==="map")      renderMap(fls,f);
}

updateSeasonDiff();
render();
</script>
</body>
</html>
