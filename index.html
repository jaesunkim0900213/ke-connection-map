<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일본 6수송 연결도 — KE S26</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif;font-size:14px;background:#f4f6f8;color:#2c3e50}
.nav{background:#1a3a5c;display:flex;align-items:stretch;position:sticky;top:0;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.nb{color:#fff;font-size:15px;font-weight:700;padding:0 18px;display:flex;align-items:center;gap:6px;border-right:1px solid rgba(255,255,255,.15);white-space:nowrap}
.nb small{font-size:11px;font-weight:400;opacity:.6}
.nt{color:rgba(255,255,255,.6);padding:13px 15px;cursor:pointer;font-size:13px;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}
.nt:hover{color:#fff;background:rgba(255,255,255,.07)}
.nt.active{color:#fff;border-bottom-color:#5b9bd5;font-weight:600}
.bdg{background:#5b9bd5;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;margin-left:4px}
.sb{background:#0f2744;padding:0 20px;display:flex;align-items:center;gap:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.sl{color:rgba(255,255,255,.45);font-size:11px;font-weight:600;margin-right:6px}
.sc{color:rgba(255,255,255,.5);padding:8px 14px;cursor:pointer;font-size:12px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;text-align:center;line-height:1.4}
.sc:hover{color:#fff;background:rgba(255,255,255,.06)}
.sc.active{color:#fff;border-bottom-color:#f0a500;font-weight:700}
.sc.off{color:rgba(255,255,255,.22);cursor:default;pointer-events:none}
.sdiff{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4);padding:8px 0}
.fbar{background:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #dde3ea}
.fl{font-size:12px;color:#555;font-weight:600;white-space:nowrap}
select,input[type=text]{border:1px solid #d0d7df;border-radius:6px;padding:5px 10px;font-size:13px;background:#fff;cursor:pointer}
select:focus,input:focus{outline:none;border-color:#5b9bd5}
.btn{background:#f4f6f8;border:1px solid #d0d7df;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;color:#444}
.btn:hover{background:#e8edf2}
.sep{width:1px;height:22px;background:#dde3ea;margin:0 2px}
.ms{border:1.5px solid #5b9bd5!important;background:#f0f6ff!important;font-weight:600;color:#1a3a5c!important}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;margin-left:auto}
.leg span{display:flex;align-items:center;gap:4px;margin-left:8px}
/* panes */
.pane{display:none;padding:16px 20px}
.pane.active{display:block}
#pane-map{padding:0;position:relative}
#pane-sch{padding:16px 20px}
#mapbox{height:calc(100vh - 118px);min-height:480px;width:100%}
/* stats */
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:11px 16px;min-width:105px}
.sn{font-size:22px;font-weight:700;line-height:1;color:#1a3a5c}
.sl2{font-size:12px;color:#888;margin-top:4px}
.sn2{font-size:11px;color:#5b9bd5;margin-top:2px}
/* table */
.wrap{overflow-x:auto;border-radius:8px;border:1px solid #dde3ea;background:#fff}
table{border-collapse:collapse;font-size:13px;width:100%}
thead th{background:#1a3a5c;color:#fff;padding:8px 9px;text-align:center;font-size:11px;font-weight:600;white-space:nowrap;position:sticky;top:0}
th.l,td.l{text-align:left;padding-left:12px}
td{padding:6px 9px;border-bottom:1px solid #f0f2f4;text-align:center;font-size:13px;vertical-align:middle}
td.dest{font-weight:700;font-size:14px}
td.time{font-variant-numeric:tabular-nums;color:#444}
tr:hover td{background:#f7f9fc!important}
.rg td{font-weight:600;font-size:11px;color:#fff;padding:4px 12px}
.cIB{background:#d4edda;color:#1a5c2a;border-radius:4px;font-weight:700;font-size:11px;padding:2px 3px;display:inline-block;width:100%;text-align:center;line-height:1.4}
.cBI{background:#d0e4f7;color:#0d3d6e;border-radius:4px;font-weight:700;font-size:11px;padding:2px 3px;display:inline-block;width:100%;text-align:center;line-height:1.4}
.cOB{background:#fef3cd;color:#7a5500;border-radius:4px;font-weight:700;font-size:11px;padding:2px 3px;display:inline-block;width:100%;text-align:center;line-height:1.4}
.ct{font-size:9px;opacity:.85;display:block}
.nr2 td{background:#f0fdf4!important}
/* airport cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;overflow:hidden}
.chdr{background:#1a3a5c;color:#fff;padding:9px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.chdr small{font-size:12px;font-weight:400;opacity:.75}
.crow{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid #f0f2f4;gap:7px}
.crow:last-child{border-bottom:none}
.rt{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.cd{font-weight:700;font-size:14px;min-width:34px}
.cf{font-size:11px;color:#888;flex:1}
.cm{font-size:11px;color:#555;text-align:right;white-space:nowrap}
.cb{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
/* timeline */
.tl{display:flex;flex-direction:column;gap:5px}
.ti{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.ti:hover{border-color:#5b9bd5}
.tt{font-size:20px;font-weight:800;color:#1a3a5c;min-width:58px;font-variant-numeric:tabular-nums}
.tb{flex:1}.tr{font-size:14px;font-weight:700}.tf{font-size:12px;color:#888;margin-top:2px}
.ta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tap{font-size:12px;padding:2px 7px;border-radius:4px;font-weight:600}
.tap.IB{background:#d4edda;color:#1a5c2a}.tap.BI{background:#d0e4f7;color:#0d3d6e}.tap.OB{background:#fef3cd;color:#7a5500}
.tc{background:#eef2f7;color:#1a3a5c;border-radius:6px;padding:5px 9px;font-weight:700;font-size:13px;text-align:center;min-width:48px}
/* ── 스케줄 탭 ── */
.sch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sch-card{background:#fff;border:1px solid #dde3ea;border-radius:10px;overflow:hidden}
.sch-hdr{padding:10px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sch-hdr .ap-code{font-size:18px;font-weight:800;letter-spacing:-.5px}
.sch-hdr .ap-name{font-size:12px;font-weight:400;opacity:.8;margin-left:6px}
.sch-section{padding:0}
.sch-section-title{font-size:11px;font-weight:700;padding:6px 16px;display:flex;align-items:center;gap:6px;border-top:1px solid #f0f2f4}
.sch-row{display:flex;align-items:center;padding:6px 16px 6px 24px;border-bottom:1px solid #f8f8f8;gap:8px}
.sch-row:last-child{border-bottom:none}
.sch-flt{font-weight:600;font-size:13px;min-width:70px;font-variant-numeric:tabular-nums}
.sch-arr{font-size:13px;color:#555;font-variant-numeric:tabular-nums;min-width:55px}
.sch-label{font-size:11px;color:#888}
.sch-conn{font-size:11px;background:#f0f6ff;color:#1a5c9e;border-radius:4px;padding:1px 6px;margin-left:auto;white-space:nowrap}
/* map */
.mleg{position:absolute;bottom:28px;left:12px;z-index:900;background:rgba(255,255,255,.95);border:1px solid #dde3ea;border-radius:8px;padding:10px 14px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mleg strong{display:block;margin-bottom:7px;color:#1a3a5c;font-size:13px;font-weight:700}
.ml{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mb{position:absolute;top:12px;right:12px;z-index:900;background:#1a3a5c;color:#fff;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nodata{text-align:center;color:#bbb;padding:40px;font-size:14px}
.mno{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;background:rgba(255,255,255,.97);border:1px solid #dde3ea;border-radius:10px;padding:24px 32px;text-align:center;font-size:14px;color:#555;box-shadow:0 4px 16px rgba(0,0,0,.1);pointer-events:none;display:none}
</style>
</head>

  let h="",last="";
  fls.forEach(fl=>{
    if(fl.region!==last){h+=`<tr class="rg"><td colspan="${5+aps.length}" style="background:${RC[fl.region]||"#444"}">${fl.regionKo} · ${fl.region}</td></tr>`;last=fl.region;}
    h+=`<tr class="${fl._new?"nr2":""}"><td class="l"><span class="rt" style="background:${RC[fl.region]||"#888"}">${fl.regionKo}</span></td><td class="l dest">${fl.route}</td><td class="l" style="font-size:12px;color:#666">${fl.obFlt}/${fl.ibFlt}</td><td class="time">${fl.ibTime}</td><td class="time">${fl.obTime}</td>`;
    aps.forEach(a=>{const ct=fl._c[a],m=(fl.conn_mins||{})[a];h+=ct?`<td><span class="c${ct}">${sym(ct)}<span class="ct">${fm(m)}</span></span></td>`:"<td style='color:#d5dbe2'>—</td>";});
    h+="</tr>";
  });
  document.getElementById("tb").innerHTML=h||`<tr><td colspan="${5+aps.length}" class="nodata">조건에 맞는 노선 없음</td></tr>`;
  document.getElementById("bm").textContent=fls.length;
  const ib=fls.filter(fl=>Object.values(fl._c).some(c=>c==="IB"||c==="BI")).length;
  const bi=fls.filter(fl=>Object.values(fl._c).some(c=>c==="BI")).length;
  const nw=fls.filter(fl=>fl._new).length;
  document.getElementById("stats").innerHTML=
    `<div class="stat"><div class="sn">${fls.length}</div><div class="sl2">전체 노선</div><div class="sn2">MAX ${fm(f.mct)}</div>${nw?`<div style="font-size:11px;color:#22c55e;margin-top:2px">▲ 신규 ${nw}편</div>`:""}</div>`+
    `<div class="stat"><div class="sn" style="color:#3a7d44">${ib}</div><div class="sl2">◀ 일본발 연결</div></div>`+
    `<div class="stat"><div class="sn" style="color:#1a5c9e">${bi}</div><div class="sl2">▶◀ 양방향</div></div>`+
    `<div class="stat"><div class="sn">${aps.length}</div><div class="sl2">활성 공항</div></div>`;
}

// ── AIRPORT ───────────────────────────────────────────────────
function renderAirport(fls,f){
  const aps=aaps(fls,f.ap);
  document.getElementById("ba").textContent=aps.length;
  document.getElementById("ag").innerHTML=aps.map(ap=>{
    const rows=fls.filter(fl=>fl._c[ap]);if(!rows.length)return"";
    const ib=rows.filter(fl=>fl._c[ap]==="IB"||fl._c[ap]==="BI").length;
    const det_rows = rows.map(fl=>{
      const ct=fl._c[ap],m=(fl.conn_mins||{})[a=ap];
      const d=fl.conn_details||{};const da=d[ap]||{};
      const bg={IB:"#d4edda",BI:"#d0e4f7",OB:"#fef3cd"}[ct];const fg={IB:"#1a5c2a",BI:"#0d3d6e",OB:"#7a5500"}[ct];
      const ib_info=da.ib?`◀${da.ib.flt}(${fm(da.ib.min)})`:"";
      const ob_info=da.ob?`▶${da.ob.flt}(${fm(da.ob.min)})`:"";
      return`<div class="crow">${fl._new?'<span style="font-size:9px;background:#22c55e;color:#fff;border-radius:3px;padding:1px 4px;font-weight:700">N</span>':""}<span class="rt" style="background:${RC[fl.region]||"#888"}">${fl.region}</span><span class="cd">${fl.route}</span><span class="cf" style="font-size:10px">${fl.obFlt}/${fl.ibFlt}</span><span class="cm" style="font-size:10px;color:#888">${ib_info}${ob_info}</span><span class="cb" style="background:${bg};color:${fg}">${sym(ct)}</span></div>`;
    });
    return`<div class="card"><div class="chdr"><span>${ap} <small>${APMETA[ap].n}</small></span><span style="font-size:12px;opacity:.8">${rows.length}편·◀${ib}</span></div>${det_rows.join("")}</div>`;
  }).join("")||"<div class='nodata'>조건에 맞는 공항 없음</div>";
}

// ── TIMELINE ──────────────────────────────────────────────────
function renderTimeline(fls,f){
  const ap=f.ap;
  const items=fls.filter(fl=>{const ok=ap?(fl._c[ap]==="IB"||fl._c[ap]==="BI"):Object.values(fl._c).some(c=>c==="IB"||c==="BI");return ok&&fl.obTime!=="-";}).sort((a,b)=>a.obTime.localeCompare(b.obTime));
  document.getElementById("tl").innerHTML=items.map(fl=>{
    const ia=APLIST.filter(a=>ap?(a===ap&&(fl._c[a]==="IB"||fl._c[a]==="BI")):(fl._c[a]==="IB"||fl._c[a]==="BI"));
    return`<div class="ti"><div class="tt">${fl.obTime}</div><div class="tb"><div class="tr">${fl._new?'<span style="font-size:9px;background:#22c55e;color:#fff;border-radius:3px;padding:1px 4px;font-weight:700;margin-right:5px">N</span>':""}<span class="rt" style="background:${RC[fl.region]||"#888"};margin-right:7px">${fl.regionKo}</span>${fl.route}<span style="font-size:12px;color:#888;margin-left:7px;font-weight:400">${fl.obFlt}/${fl.ibFlt}</span></div><div class="tf">ICN 귀착 ${fl.ibTime}</div><div class="ta">${ia.map(a=>{const d=(fl.conn_details||{})[a]||{};const ib=d.ib,ob=d.ob;const ct=fl._c[a];const flt=ct==="IB"?ib?.flt:ct==="OB"?ob?.flt:ib?.flt;const mn=ct==="IB"?ib?.min:ct==="OB"?ob?.min:ib?.min;return`<span class="tap ${ct}">${a} ${sym(ct)} <span style="font-size:10px;opacity:.8">${fm(mn)}${flt?" "+flt:""}</span></span>`;}).join("")}</div></div><div class="tc">${ia.length}개<br>공항</div></div>`;
  }).join("")||"<div class='nodata'>일본발 연결편 없음</div>";
}

// ── SCHEDULE TAB ─────────────────────────────────────────────
function renderSch(){
  const selAp = document.getElementById("sch-ap").value;
  const aps = selAp ? [selAp] : APLIST;
  const mct = parseInt(document.getElementById("fmct").value)||241;
  const FL = SEASONS[curSeason]||[];
  
  const grid = document.getElementById("sch-grid");
  grid.innerHTML = aps.map(ap=>{
    const obSch = AP_SCH_OB[ap]||[];
    const ibSch = AP_SCH_IB[ap]||[];
    if(!obSch.length && !ibSch.length) return "";
    
    // 각 일본편별 연결 가능 국제선 목록
    const obRows = obSch.map(([flt,arr])=>{
      const arr_m = toMin(arr);
      // 이 편으로 연결 가능한 국제선 O/B (60~mct분 이내)
      const conns = FL.filter(fl=>{
        const dep = toMin(fl.obTime);
        if(!dep) return false;
        let diff = dep - arr_m;
        if(diff<0) diff+=1440;
        return diff>=60 && diff<=mct;
      }).map(fl=>{
        let diff = toMin(fl.obTime) - arr_m;
        if(diff<0) diff+=1440;
        return`${fl.route}(${fm(diff)})`;
      });
      return`<div class="sch-row"><span class="sch-flt">${flt}</span><span class="sch-arr">착 ${arr}</span><span class="sch-label">ICN 도착</span><span class="sch-conn" title="연결 가능 국제선">${conns.length>0?conns.slice(0,4).join(" · ")+(conns.length>4?` +${conns.length-4}`:""):"연결편 없음"}</span></div>`;
    }).join("");
    
    const ibRows = ibSch.map(([flt,dep])=>{
      const dep_m = toMin(dep);
      const conns = FL.filter(fl=>{
        const arr = toMin(fl.ibTime);
        if(!arr) return false;
        let diff = dep_m - arr;
        if(diff<0) diff+=1440;
        return diff>=60 && diff<=mct;
      }).map(fl=>{
        let diff = dep_m - toMin(fl.ibTime);
        if(diff<0) diff+=1440;
        return`${fl.route}(${fm(diff)})`;
      });
      return`<div class="sch-row"><span class="sch-flt">${flt}</span><span class="sch-arr">발 ${dep}</span><span class="sch-label">ICN 출발</span><span class="sch-conn" title="수신 가능 국제선">${conns.length>0?conns.slice(0,4).join(" · ")+(conns.length>4?` +${conns.length-4}`:""):"연결편 없음"}</span></div>`;
    }).join("");
    
    const apColor = "#1a3a5c";
    return`<div class="sch-card">
      <div class="sch-hdr" style="background:${apColor};color:#fff">
        <div><span class="ap-code">${ap}</span><span class="ap-name">${APMETA[ap].n}</span></div>
        <div style="font-size:11px;opacity:.8">MAX ${fm(mct)}</div>
      </div>
      ${obRows?`<div class="sch-section-title" style="background:#f0fdf4;color:#1a5c2a"><span>◀</span> Japan→ICN 도착 (일본발 연결)</div>${obRows}`:""}
      ${ibRows?`<div class="sch-section-title" style="background:#eff6ff;color:#1a5c9e"><span>▶</span> ICN→Japan 출발 (해외발 연결)</div>${ibRows}`:""}
    </div>`;
  }).join("")||"<div class='nodata'>스케줄 없음</div>";
}

function toMin(s){if(!s||s==="-")return null;const[h,m]=s.split(":").map(Number);return h*60+m;}

// ── MAP ───────────────────────────────────────────────────────
function initMap(){if(map)return;map=L.map("mapbox",{center:[36,134],zoom:5});L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap © CARTO",subdomains:"abcd",maxZoom:12}).addTo(map);}
function clrMap(){ml.forEach(l=>{try{map.removeLayer(l);}catch(e){}});ml=[];}
function mkBox(lb,bg,sz,op){return L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div style="background:${bg};color:#fff;border:2px solid rgba(255,255,255,.85);border-radius:5px;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-size:${sz>24?10:8}px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:${op||1};text-align:center;line-height:1.1">${lb}</div>`});}
function mkCirc(lb,bg,sz){return L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div style="background:${bg};color:#fff;border:2.5px solid rgba(255,255,255,.9);border-radius:50%;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3);text-align:center;line-height:1.1">${lb}</div>`});}

function renderMap(fls,f){
  if(!map)return;clrMap();
  document.getElementById("mno").style.display=fls.length?"none":"block";if(!fls.length)return;
  document.getElementById("mb").textContent="⏱ "+curSeason+" MAX "+fm(f.mct);
  const apF=f.ap;
  ml.push(L.marker([ICN.lat,ICN.lng],{icon:mkCirc("인천<br>ICN","#1a3a5c",42),zIndexOffset:2000}).addTo(map));
  const am={};
  APLIST.forEach(ap=>{const r=fls.filter(fl=>fl._c[ap]);if(!r.length){am[ap]=null;return;}const t=r.map(fl=>fl._c[ap]);am[ap]=t.includes("BI")?"BI":t.includes("IB")?"IB":"OB";});
  APLIST.forEach(ap=>{
    const ct=am[ap],mt=APMETA[ap],ac=!!ct,hl=!apF||apF===ap;
    const sz=ac?28:20,op=hl&&ac?1:ac?0.4:0.22;
    const m=L.marker([mt.lat,mt.lng],{icon:mkBox(ap,ac?LC[ct]:"#9ca3af",sz,op),zIndexOffset:ac?500:50}).addTo(map);ml.push(m);
    if(ac&&hl)ml.push(L.polyline([[ICN.lat,ICN.lng],[mt.lat,mt.lng]],{color:LC[ct],weight:ct==="BI"?3.5:2.5,opacity:.85,dashArray:ct==="OB"?"8,5":null}).addTo(map));
    if(ac){
      const rows=fls.filter(fl=>fl._c[ap]);
      let p=`<div style="font-family:sans-serif;min-width:240px"><div style="font-weight:700;font-size:14px;margin-bottom:4px">${ap} ${mt.n}</div>`;
      p+=`<div style="font-size:12px;color:#555;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eee">${{IB:"◀ 일본발",BI:"▶◀ 양방향",OB:"▶ 해외발만"}[ct]} · ${rows.length}편</div>`;
      // 스케줄 표시
      const obSch=AP_SCH_OB[ap]||[],ibSch=AP_SCH_IB[ap]||[];
      if(obSch.length){p+=`<div style="font-size:11px;font-weight:700;color:#1a5c2a;margin-bottom:3px">◀ Japan→ICN 도착</div>`;obSch.forEach(([flt,t])=>{p+=`<div style="font-size:12px;padding:1px 0"><b>${flt}</b> ICN착 ${t}</div>`;});}
      if(ibSch.length){p+=`<div style="font-size:11px;font-weight:700;color:#1a5c9e;margin-top:6px;margin-bottom:3px">▶ ICN→Japan 출발</div>`;ibSch.forEach(([flt,t])=>{p+=`<div style="font-size:12px;padding:1px 0"><b>${flt}</b> ICN발 ${t}</div>`;});}
      p+=`<div style="margin-top:8px;padding-top:6px;border-top:1px solid #eee;font-size:11px;font-weight:700;color:#444">연결 국제선 (TOP 5)</div>`;
      rows.slice(0,5).forEach(fl=>{const mn=(fl.conn_mins||{})[ap];p+=`<div style="font-size:12px;padding:1px 0">${fl.route} ${fl.obFlt} — ${sym(fl._c[ap])} ${fm(mn)}</div>`;});
      if(rows.length>5)p+=`<div style="font-size:11px;color:#999">외 ${rows.length-5}편...</div>`;
      p+="</div>";
      m.bindPopup(p,{maxWidth:300});
      m.on("click",()=>{const s=document.getElementById("fap");s.value=(s.value===ap)?"":ap;R();});
    }else m.bindTooltip(`${ap} ${mt.n}<br><small style="color:#c00">현재 조건 연결 없음</small>`,{direction:"top"});
  });
  const dm={};
  fls.forEach(fl=>{if(!dm[fl.route])dm[fl.route]={fls:[],types:new Set()};dm[fl.route].fls.push(fl);const ct=apF?fl._c[apF]:null;if(ct)dm[fl.route].types.add(ct);else Object.values(fl._c).forEach(c=>dm[fl.route].types.add(c));});
  Object.entries(dm).forEach(([r,info])=>{
    const coord=DC[r];if(!coord)return;
    const ts=[...info.types],ct=ts.includes("BI")?"BI":ts.includes("IB")?"IB":ts.includes("OB")?"OB":null;if(!ct)return;
    ml.push(L.polyline([[ICN.lat,ICN.lng],coord],{color:LC[ct],weight:2,opacity:.5,dashArray:ct==="OB"?"7,5":null}).addTo(map));
    ml.push(L.marker(coord,{icon:L.divIcon({className:"",iconSize:null,iconAnchor:[0,8],html:`<div style="background:${RC[info.fls[0].region]||"#555"};color:#fff;border:1.5px solid rgba(255,255,255,.7);border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)">${r}</div>`}),zIndexOffset:100}).addTo(map));
  });
  const coords=[[ICN.lat,ICN.lng]];
  if(apF&&APMETA[apF])coords.push([APMETA[apF].lat,APMETA[apF].lng]);
  Object.keys(dm).forEach(r=>{if(DC[r])coords.push(DC[r]);});
  if(!apF)APLIST.filter(a=>am[a]).forEach(a=>coords.push([APMETA[a].lat,APMETA[a].lng]));
  try{map.fitBounds(coords,{padding:[50,50],maxZoom:6});}catch(e){}
}

function R(){
  const f=gf(),fls=ff(f);
  if(curTab==="matrix")        renderMatrix(fls,f);
  else if(curTab==="airport")  renderAirport(fls,f);
  else if(curTab==="timeline") renderTimeline(fls,f);
  else if(curTab==="map")      renderMap(fls,f);
}

buildSBtns();updateDiff();R();
</script>
</body>
